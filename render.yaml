services:
  - type: web
    name: slack-clone-backend
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev is required here: NODE_ENV=production below is exported
    # into the build environment too (not just runtime), which makes plain
    # `npm ci` skip devDependencies — and typescript, @types/*, vitest, and
    # supertest all live there. Without this flag `tsc` can't find type
    # declarations for express/multer/jsonwebtoken/etc. and the build fails.
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` (node dist/server.js) fails at runtime: this backend uses
    # native ESM ("type": "module") with extensionless relative imports
    # (e.g. `from './app'`), which tsc leaves as-is when compiling — Node's
    # own ESM loader requires the full `.js` extension on relative imports
    # and can't resolve these, throwing ERR_MODULE_NOT_FOUND. `npm run build`
    # above still runs as a type-check gate, but running the TS source
    # directly via tsx (same as the dev script) sidesteps the compiled
    # output's extension problem entirely.
    startCommand: npm run db:deploy && npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Database is Supabase, not Render's managed Postgres — no
      # `databases:` block/fromDatabase here. Paste the Supabase connection
      # string (Session pooler, not the direct/IPv6-only one — see deploy
      # notes) into this var via the Render dashboard after the blueprint
      # creates the service.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Must equal the frontend service's real URL for CORS to allow it
      # (see the allowedOrigins check in app.ts). The "slack-clone-frontend"
      # name was already taken on Render, so it got suffixed to this actual
      # deployed URL — update this again if the service is ever recreated
      # under a different name/suffix.
      - key: APP_URL
        value: https://slack-clone-frontend-gpvf.onrender.com
      # Secrets — not safe to commit. Fill these in via the Render dashboard
      # after the blueprint creates the service.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: slack-clone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Client-side routing (react-router-dom's createBrowserRouter) needs
    # every path to fall back to index.html so deep links don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # "slack-clone-backend" was already taken on Render too, so the actual
      # deployed backend is at this suffixed URL — same caveat as APP_URL.
      - key: VITE_API_URL
        value: https://slack-clone-backend-w8qp.onrender.com
      - key: VITE_BACKEND_URL
        value: https://slack-clone-backend-w8qp.onrender.com
