services:
  - type: web
    name: smartconnect-backend
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev is required here: NODE_ENV=production below is exported
    # into the build environment too (not just runtime), which makes plain
    # `npm ci` skip devDependencies — and typescript, @types/*, vitest, and
    # supertest all live there. Without this flag `tsc` can't find type
    # declarations for express/multer/jsonwebtoken/etc. and the build fails.
    # (tsx, used by startCommand, is a devDependency too.)
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` (node dist/server.js) fails at runtime: this backend uses
    # native ESM ("type": "module") with extensionless relative imports
    # (e.g. `from './app'`), which tsc leaves as-is when compiling — Node's
    # own ESM loader requires the full `.js` extension on relative imports
    # and can't resolve these, throwing ERR_MODULE_NOT_FOUND. `npm run build`
    # above still runs as a type-check gate, but running the TS source
    # directly via tsx (same as the dev script) sidesteps the compiled
    # output's extension problem entirely.
    # Note: `db:deploy` (prisma migrate deploy) applies any pending migrations
    # on every start, and a failing migration stops the new version from
    # starting. Check the data a new migration depends on before deploying it
    # (e.g. no case-insensitive duplicate e-mails before
    # 20261111100000_user_email_case_insensitive_unique).
    startCommand: npm run db:deploy && npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # Database is Supabase, not Render's managed Postgres — no
      # `databases:` block/fromDatabase here. Paste the Supabase connection
      # string (Session pooler, not the direct/IPv6-only one, and never the
      # transaction pooler — migrations need a session) into this var via the
      # Render dashboard after the blueprint creates the service.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The frontend static site's public URL, e.g.
      # https://smartconnect-frontend.onrender.com (Render may add a suffix if
      # the name is taken — copy the exact URL from the frontend service; no
      # trailing slash needed). It is the only browser origin CORS and
      # Socket.IO accept in production, and the base of invitation,
      # activation and password-reset links. The backend refuses to start in
      # production without it.
      - key: APP_URL
        sync: false
      # Secrets — not safe to commit. Fill these in via the Render dashboard
      # after the blueprint creates the service.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Gmail SMTP is gone — Render's free tier silently blocks/times-out
      # outbound SMTP (both 587 and 465), so email now goes through Resend's
      # HTTP API instead. Paste the API key from resend.com/api-keys here.
      - key: RESEND_API_KEY
        sync: false
      # Optional sender, e.g. "SmartConnect <no-reply@your-verified-domain>" —
      # the domain must be verified in Resend. Leave blank to use Resend's
      # shared test sender (delivers only to the Resend account owner).
      - key: EMAIL_FROM
        sync: false
      # Calls: a TURN relay (e.g. a coturn server with use-auth-secret) lets
      # calls connect behind strict NATs/firewalls. Optional — leave empty to
      # use STUN only (calls then work on open networks only). Comma-separated
      # turn:/turns: URLs; the shared secret makes short-lived per-user
      # credentials (CALL_TURN_USERNAME/CALL_TURN_CREDENTIAL for static ones).
      - key: CALL_TURN_URLS
        sync: false
      - key: CALL_TURN_SECRET
        sync: false
      # Express trusts exactly one proxy hop in production (Render's load
      # balancer), so rate limits see each client's own IP. Override only if
      # needed with TRUST_PROXY (a hop count, true/false or an Express value).
      # Real-time state is per process: keep this service at ONE instance.

  - type: web
    name: smartconnect-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Client-side routing (react-router-dom's createBrowserRouter) needs
    # every path to fall back to index.html so deep links don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # T.32 (audit L32): baseline browser security headers for the web app.
    # (No Content-Security-Policy yet: the API and Socket.IO origins are set
    # at build time, so a CSP must be written for the final URLs — see T.32.)
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # The backend web service's public URL, e.g.
      # https://smartconnect-backend.onrender.com (copy the exact URL from the
      # backend service; no `/api` suffix). Vite bakes both into the bundle
      # at build time, so redeploy the frontend after changing them.
      - key: VITE_API_URL
        sync: false
      - key: VITE_BACKEND_URL
        sync: false
