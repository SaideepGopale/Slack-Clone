services:
  - type: web
    name: slack-clone-backend
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev is required here: NODE_ENV=production below is exported
    # into the build environment too (not just runtime), which makes plain
    # `npm ci` skip devDependencies — and typescript, @types/*, vitest, and
    # supertest all live there. Without this flag `tsc` can't find type
    # declarations for express/multer/jsonwebtoken/etc. and the build fails.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Database is Supabase, not Render's managed Postgres — no
      # `databases:` block/fromDatabase here. Paste the Supabase connection
      # string (Session pooler, not the direct/IPv6-only one — see deploy
      # notes) into this var via the Render dashboard after the blueprint
      # creates the service.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Must equal the frontend service's real URL for CORS to allow it
      # (see the allowedOrigins check in app.ts). Predictable from the
      # frontend service's name below (https://<name>.onrender.com) — if
      # that name is taken on Render and gets auto-suffixed, update this
      # value in the Render dashboard after the first deploy.
      - key: APP_URL
        value: https://slack-clone-frontend.onrender.com
      # Secrets — not safe to commit. Fill these in via the Render dashboard
      # after the blueprint creates the service.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    name: slack-clone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Client-side routing (react-router-dom's createBrowserRouter) needs
    # every path to fall back to index.html so deep links don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Predictable from the backend service's name above
      # (https://<name>.onrender.com) — same caveat as APP_URL if that name
      # gets auto-suffixed by Render.
      - key: VITE_API_URL
        value: https://slack-clone-backend.onrender.com
      - key: VITE_BACKEND_URL
        value: https://slack-clone-backend.onrender.com
