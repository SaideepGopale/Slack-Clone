name: CI

# T.32 (audit M27): runs for the release branch too, on the Node version
# Render deploys with (render.yaml NODE_VERSION), and checks the schema.
on:
  pull_request:
    branches: [main, smartconnect-release]
  push:
    branches: [main, smartconnect-release]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: slack_clone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/slack_clone_test
      JWT_SECRET: ci-test-jwt-secret
      CLOUDINARY_CLOUD_NAME: ci-test
      CLOUDINARY_API_KEY: ci-test
      CLOUDINARY_API_SECRET: ci-test
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Every migration applies cleanly to an empty database and the result
      # matches schema.prisma (no drift) — the same checks a deployment relies on.
      - run: npx prisma migrate deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
